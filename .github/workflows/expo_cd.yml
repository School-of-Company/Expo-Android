name: Android CD

on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'Version bump type'
        required: true
        default: 'None'
        type: choice
        options:
          - None
          - Patch
          - Minor
          - Major
      track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/refactor/713-imyeonghun-atomic-release-process'

    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit info
        run: |
          echo "COMMIT_HASH=${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Update version.properties
        if: ${{ github.event.inputs.version_bump_type != 'None' }}
        id: version_bump
        run: |
          VERSION_CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'VERSION_NAME=' version.properties | cut -d'=' -f2)
          
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          IFS='.' read -ra ADDR <<< "$VERSION_NAME"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          PATCH=${ADDR[2]}
          
          case "${{ github.event.inputs.version_bump_type }}" in
            Major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            Minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            Patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          
          sed -i "s/VERSION_CODE=.*/VERSION_CODE=$NEW_VERSION_CODE/" version.properties
          sed -i "s/VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION_NAME/" version.properties
          
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV
          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          echo "BUMPED=true" >> $GITHUB_ENV

      - name: Set current version for notification
        if: ${{ github.event.inputs.version_bump_type == 'None' }}
        run: |
          VERSION_CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'VERSION_NAME=' version.properties | cut -d'=' -f2)
          echo "NEW_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "NEW_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUMPED=false" >> $GITHUB_ENV

      - name: Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            ${{ runner.os }}-

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create LOCAL_PROPERTIES
        run: echo '${{ secrets.LOCAL_PROPERTIES }}' > ./local.properties

      - name: Create service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Assemble Release Bundle
        run: ./gradlew bundleRelease --no-daemon

      - name: Get bundle info
        run: |
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            BUNDLE_SIZE=$(du -h "app/build/outputs/bundle/release/app-release.aab" | cut -f1)
            echo "BUNDLE_SIZE=${BUNDLE_SIZE}" >> $GITHUB_ENV
          else
            echo "BUNDLE_SIZE=빌드 실패" >> $GITHUB_ENV
          fi
          
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "BUILD_TIME=${BUILD_TIME}초" >> $GITHUB_ENV

      - name: Sign Release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.school_of_company.expo_android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}

      - name: Commit & Push Version Update
        if: ${{ success() && env.BUMPED == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump version to v${{ env.NEW_VERSION_NAME }} (${{ env.NEW_VERSION_CODE }}) [skip ci]"
          # 현재 테스트 브랜치로 푸시하도록 수정
          git push origin refactor/713-imyeonghun-atomic-release-process

      - name: Android CD Discord Notification (Success)
        uses: sarisia/actions-status-discord@v1
        if: ${{ success() }}
        with:
          title: CD 성공~
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            버전: v${{ env.NEW_VERSION_NAME }} (${{ env.NEW_VERSION_CODE }})
            트랙: ${{ github.event.inputs.track }}
            빌드 시간: ${{ env.BUILD_TIME }}
            용량: ${{ env.BUNDLE_SIZE }}
            커밋: "${{ env.COMMIT_MSG }}" (${{ env.COMMIT_HASH }})
            링크: [Play Console](https://play.google.com/console/developers) | [로그 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 65280
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: Expo-CD Bot

      - name: Android CD Discord Notification (Fail)
        uses: sarisia/actions-status-discord@v1
        if: ${{ failure() }}
        with:
          title: CD 실패~
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            커밋: "${{ env.COMMIT_MSG }}" (${{ env.COMMIT_HASH }})
            소요 시간: ${{ env.BUILD_TIME }}
            링크: [로그 확인하기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 16711680
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: Expo-CD Bot
